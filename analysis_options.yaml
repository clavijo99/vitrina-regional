# Lints estrictos: flutter_lints + modos estrictos del analizador + reglas extra.
# El CI ejecuta `flutter analyze`: cualquier warning o info hace fallar el PR.
include: package:flutter_lints/flutter.yaml

analyzer:
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true
  errors:
    # Los TODO(COIL-Ex) son tareas de los encuentros; no deben romper el CI.
    todo: ignore
  exclude:
    - build/**
    - lib/**/*.g.dart
    - android/**
    - ios/**
    - web/**
    - windows/**
    - macos/**
    - linux/**

linter:
  rules:
    # Estilo y legibilidad
    - always_declare_return_types
    - always_use_package_imports
    - directives_ordering
    - prefer_single_quotes
    - prefer_final_locals
    - prefer_final_in_for_each
    - prefer_const_constructors
    - prefer_const_declarations
    - prefer_const_literals_to_create_immutables
    - sort_child_properties_last
    - sort_constructors_first
    - unnecessary_lambdas
    - unnecessary_parenthesis
    - use_super_parameters
    - use_named_constants
    # Seguridad de tipos y errores comunes
    - avoid_dynamic_calls
    - avoid_type_to_string
    - avoid_void_async
    - cancel_subscriptions
    - close_sinks
    - only_throw_errors
    - unawaited_futures
    - use_build_context_synchronously
    - avoid_print
    - avoid_slow_async_io
    - throw_in_finally
    - test_types_in_equals
    - literal_only_boolean_expressions
    - no_adjacent_strings_in_list
